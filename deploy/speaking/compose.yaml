name: polyspeak
services:
  speaking:
    build:
      context: ../..
      dockerfile: deploy/speaking/Dockerfile
    restart: unless-stopped
    expose: ["8008"]
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set the API key in cloud.env}
      SPEAKING_AVATAR_DEVICE: cuda
      SPEAKING_MODEL_BASE_URL: ${SPEAKING_MODEL_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      SPEAKING_CHAT_MODEL: ${SPEAKING_CHAT_MODEL:-qwen-plus-latest}
      SPEAKING_TTS_PROVIDER: ${SPEAKING_TTS_PROVIDER:-edgetts}
      SPEAKING_VOICE_EN: ${SPEAKING_VOICE_EN:-en-US-JennyNeural}
      SPEAKING_VOICE_ZH: ${SPEAKING_VOICE_ZH:-zh-CN-XiaoxiaoNeural}
      SPEAKING_REALTIME_TTS_VOICE: ${SPEAKING_REALTIME_TTS_VOICE:-Cherry}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_REGION: ${AZURE_REGION:-eastus}
    volumes:
      - runtime:/app/speaking-runtime
      - ../../speaking-models:/app/speaking-models:ro
      - ../../speaking-resources/official:/app/speaking-resources/official:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      speaking:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    environment:
      SPEAKING_DOMAIN: ${SPEAKING_DOMAIN:?Set a real domain in cloud.env}
      SPEAKING_DEMO_USER: ${SPEAKING_DEMO_USER:-team}
      SPEAKING_DEMO_PASSWORD_HASH: ${SPEAKING_DEMO_PASSWORD_HASH:?Generate a password hash first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
volumes:
  runtime:
  tls_data:
  tls_config:
